<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Akces</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="icon" href="akces.png" type="image/png">
    <meta name="author" content="Miguel Angel">
    <meta name="description" content="Checkout page for Akces, a modern e-commerce platform.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-main: #101828;
            --bg-card: #1e293b;
            --accent: #2563eb;
            --accent-light: #38bdf8;
            --text-main: #fff;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --paypal-btn-bg: #fff;
            --paypal-btn-border: #2563eb;
            --paypal-btn-text: #2563eb;
            --paypal-btn-hover-bg: #2563eb;
            --paypal-btn-hover-text: #fff;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            letter-spacing: 0.01em;
        }
        main {
            max-width: 1100px;
            margin: 40px auto 0 auto;
            padding: 0 16px;
        }
        h1, h2, h3 {
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--accent-light);
            margin-bottom: 0.5em;
        }
        .cart-items {
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-right: 10px;
            background: #0f172a;
            border-radius: 5px;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-title {
            font-weight: 600;
            color: var(--accent-light);
        }
        .cart-item-qty {
            margin: 0 10px;
        }
        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-light);
            text-align: right;
            margin-bottom: 20px;
        }
        .shipping-form {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .shipping-form label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }
        .shipping-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #0f172a;
            color: var(--text-main);
        }
        #paypal-button-container {
            text-align: center; /* Centrar el botón de PayPal */
        }
        #paypal-button-container button {
            width: 100%; /* El botón ocupa todo el ancho */
            max-width: 500px; /* Limitar el ancho máximo */
            margin: 0 auto; /* Centrar horizontalmente */
            padding: 12px 0; /* Espaciado interno */
            font-size: 1.1rem; /* Tamaño de fuente */
            font-weight: bold; /* Negrita */
            color: var(--paypal-btn-text); /* Color del texto */
            background: var(--paypal-btn-bg); /* Color de fondo */
            border: 2px solid var(--paypal-btn-border); /* Borde */
            border-radius: 8px; /* Bordes redondeados */
            cursor: pointer; /* Cursor de mano */
            transition: background 0.2s, color 0.2s, border-color 0.2s; /* Transiciones suaves */
        }

        #paypal-button-container button:hover {
            background: var(--paypal-btn-hover-bg);
            color: var(--paypal-btn-hover-text);
            border-color: var(--paypal-btn-hover-bg);
        }

    </style>
</head>
<body>
    <main>
        <h1>Checkout</h1>

        <div class="cart-items" id="cart-items">
            </div>

        <div class="cart-total" id="cart-total">
            </div>

        <div class="shipping-form">
            <h2>Datos de Envío</h2>
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>

            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" name="ciudad" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <div id="paypal-button-container">
            </div>
    </main>

    <script>
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const total = localStorage.getItem('akces_total') || 0;

        function renderCart() {
            const itemsDiv = document.getElementById('cart-items');
            const totalDiv = document.getElementById('cart-total');
            itemsDiv.innerHTML = '';
            let totalCarrito = 0;

            carrito.forEach(item => {
                totalCarrito += item.precio * item.qty;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.nombre}">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.nombre}</div>
                        <div class="cart-item-qty">Cantidad: ${item.qty}</div>
                    </div>
                    <span>$${(item.precio * item.qty).toLocaleString('es-CO')} COP</span>
                `;
                itemsDiv.appendChild(div);
            });

             // Actualiza el total del carrito, ya sea desde localStorage o recalculado.
            totalDiv.textContent = "Total: $" + (parseFloat(total) || totalCarrito).toLocaleString('es-CO') + " COP";
        }

        renderCart();

        // --- PayPal SDK ---
        paypal.Buttons({
            createOrder: function(data, actions) {
                // Configura la transacción con el total del carrito.
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: parseFloat(total).toFixed(2) // Usa el total del carrito
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    // Aquí puedes enviar los detalles del pedido a tu servidor
                    // y mostrar un mensaje de éxito al usuario.
                    alert('Transacción completada por ' + details.payer.name.given_name);
                    // Limpia el carrito
                    localStorage.removeItem('carrito');
                    // Redirige a una página de confirmación (si la tienes)
                    // window.location.href = "confirmacion.html";
                });
            },
            onError: function(err) {
                // Maneja errores de PayPal.
                console.error(err);
                alert('Hubo un error al procesar tu pago con PayPal.');
            }
        }).render('#paypal-button-container'); // Renderiza el botón de PayPal en el contenedor.
    </script>
</body>
</html>
